kind: pipeline
type: docker
name: web-release

platform:
  os: linux
  arch: arm64

concurrency:
  limit: 1

trigger:
  event: [tag]
  ref: [refs/tags/v*]

steps:
  - name: validate-build
    image: oven/bun:1
    commands:
      - 'test "$${#DRONE_TAG}" -le 128 && printf "%s\n" "$DRONE_TAG" | grep -Eq "^v[a-zA-Z0-9_.-]+$"'
      - bun build app.js --target browser --outdir /tmp/f1ap-web-browser
      - bun build auth-ui.js --target browser --outdir /tmp/f1ap-web-auth
      - bun build server.ts --target bun --outdir /tmp/f1ap-web-server

  - name: publish
    image: plugins/docker
    settings:
      registry: ghcr.io
      repo: ghcr.io/xiaob1n/f1ap-web
      tags: ${DRONE_TAG}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      fingerprint:
        from_secret: deploy_fingerprint
      script_stop: true
      script:
        - '/home/ubuntu/docker/f1ap-web/deploy/release.sh "${DRONE_TAG}"'
